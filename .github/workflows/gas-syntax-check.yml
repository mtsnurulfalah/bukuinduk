name: GAS syntax check

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'gas-backend/**/*.gs'
      - '.github/workflows/gas-syntax-check.yml'
  pull_request:
    paths:
      - 'gas-backend/**/*.gs'
      - '.github/workflows/gas-syntax-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate Apps Script JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check each GAS source file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(gas-backend/*.gs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No GAS source files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check - < "${file}"
          done
